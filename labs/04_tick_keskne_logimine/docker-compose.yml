services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=Monitor2026!
      - DOCKER_INFLUXDB_INIT_ORG=hkhk
      - DOCKER_INFLUXDB_INIT_BUCKET=mon
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=monitoring-token-2026
    volumes:
      - influxdb-data:/var/lib/influxdb2

  telegraf:
    image: telegraf:1.34
    container_name: telegraf
    environment:
      - INFLUX_TOKEN=monitoring-token-2026
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - influxdb

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  influxdb-data:
