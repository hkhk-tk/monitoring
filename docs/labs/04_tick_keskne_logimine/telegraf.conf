[agent]
  interval = "10s"
  hostname = "minu-vm"

# INPUT: süsteemimeetrikad
[[inputs.cpu]]
  percpu = false
  totalcpu = true

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "overlay"]

# INPUT: MQTT sensorid (Osa 7 — kodutöö)
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["sensorid/+/temperatuur"]
  data_format = "value"
  data_type = "float"
  name_override = "temperatuur"

# OUTPUT: InfluxDB 2.7
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "hkhk"
  bucket = "mon"

# OUTPUT: dual-output faili (Osa 6 — kodutöö)
[[outputs.file]]
  files = ["/tmp/telegraf-out.txt"]
  data_format = "influx"
